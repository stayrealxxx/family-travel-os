<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d62828"/>
      <stop offset="100%" stop-color="#b51717"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f5f7fb" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a1010" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- snow dots -->
  <circle cx="92" cy="88" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="420" cy="110" r="8" fill="#ffffff" opacity="0.85"/>
  <circle cx="390" cy="72" r="6" fill="#ffffff" opacity="0.75"/>
  <circle cx="120" cy="140" r="6" fill="#ffffff" opacity="0.75"/>
  <circle cx="450" cy="170" r="9" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="180" r="7" fill="#ffffff" opacity="0.8"/>

  <!-- card / travel sheet -->
  <g filter="url(#shadow)">
    <rect x="116" y="118" width="280" height="300" rx="28" fill="url(#snow)"/>
    <rect x="145" y="156" width="150" height="18" rx="9" fill="#c8ced9"/>
    <rect x="145" y="192" width="210" height="14" rx="7" fill="#d8dde6"/>
    <rect x="145" y="220" width="180" height="14" rx="7" fill="#d8dde6"/>
    <rect x="145" y="280" width="170" height="14" rx="7" fill="#d8dde6"/>
    <rect x="145" y="308" width="135" height="14" rx="7" fill="#d8dde6"/>
    <rect x="145" y="336" width="195" height="14" rx="7" fill="#d8dde6"/>
  </g>

  <!-- christmas tree -->
  <g transform="translate(0,8)">
    <polygon points="256,176 206,244 306,244" fill="#1f8b4c"/>
    <polygon points="256,214 190,298 322,298" fill="#1a7a42"/>
    <polygon points="256,258 174,356 338,356" fill="#146b39"/>
    <rect x="240" y="356" width="32" height="38" rx="6" fill="#7a4a21"/>

    <!-- ornaments -->
    <circle cx="256" cy="236" r="8" fill="#ffd166"/>
    <circle cx="224" cy="278" r="8" fill="#4dabf7"/>
    <circle cx="288" cy="278" r="8" fill="#ff6b6b"/>
    <circle cx="210" cy="320" r="8" fill="#ffd166"/>
    <circle cx="256" cy="320" r="8" fill="#ff6b6b"/>
    <circle cx="302" cy="320" r="8" fill="#4dabf7"/>

    <!-- star -->
    <polygon points="256,154 263,169 279,171 267,182 270,198 256,190 242,198 245,182 233,171 249,169"
      fill="#ffd84d"/>
  </g>

  <!-- tiny plane -->
  <g transform="translate(316,118) rotate(18)">
    <path d="M0 18 L48 0 L52 8 L26 21 L51 28 L47 37 L17 30 L3 43 L0 40 L8 26 Z"
          fill="#1769e0"/>
  </g>
</svg>